<!-- Creating the actual webpage down below! -->

<div class="title">
<h1> <b> CONTACT: </b> </h1>
</div>

<p style="font-size: 15px;"> Questions? Queries? Concerns? <br><br>
 Ask away! The contact form is down below. <br><br>
 Each asterisk indicates a required field you must fill. <br><br>
 Please fill out the following information in this form: <br></p>


<br>
<hr>
<br>
    <form style="font-size: 21px;">
        <div>
         <label for="fname">First Name * :</label>
         <input type="text" id="fname" name="fname" placeholder="Jane" required>
        </div>
        <br>
        <div>
         <label for="lname">Last Name * :</label>
         <input type="text" id="lname" name="lname" placeholder="Doe" required>
        </div>
        <br>
        <div>
            <label for="email">Email Address * :</label>
            <input type="email" id="email" name="email" placeholder="JDoe@gmail.com" required>
        </div>
        <br>
        <div>
            <label for="phone">Phone Number * :</label>
            <input type="tel" id="phone" name="phone" placeholder="(123)-456-7890" maxlength="21" required>
        </div>
        <br>
        <div>
            <label for="city">City:</label>
            <select id="city" name="city">
                <option value="Auckland">Auckland</option>
                <option value="Christchurch">Christchurch</option>
                <option value="Wellington">Wellington</option>
                <option value="Dunedin">Dunedin</option>
                <option value="Hamilton">Hamilton</option>
                <option value="Tauranga">Tauranga</option>
                <option value="Nelson">Nelson</option>
            </select>
        </div>
        <br>
        <div>
            <label for="tc">I agree to the terms and conditions * </label>
            <input type="checkbox" id="tc" name="tc" required>
        </div>
        <br>
        <div>
            <input type="reset">
        </div>
        <br>
        <div>
            <input type="submit">
        </div>
    </form>

<br>


    <!-- Creating the footer! -->
<footer>
    <div class="footer">
        <div class="logo"> <img src="logo.png" alt="Ocean Protection Logo" height="40px" width="300px"> </div>
        <div class="footermenu">
            <b style="color: white;">Phone Number: 0800 NATURE</b>
        </div>
    </div>
</footer>
</body>
</html>
